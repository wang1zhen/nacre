[project]
name = "nacre-gmsh"
version = "0.1.0"
description = "Optional Gmsh frontend for nacre"
requires-python = ">=3.11"
dependencies = [
    "gmsh>=4.15.2",
    "nacre",
]
license = "GPL-3.0-or-later"
readme = "README.md"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
nacre = { workspace = true }
