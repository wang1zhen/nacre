name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NACRE_CHECKMESH_IMAGE: nacre-openfoam:2606
  OPENFOAM_IMAGE_REF: docker.io/opencfd/openfoam-run@sha256:4229997e74defb81548222d511b8e3b95b98305e5df41b8e88b031813fe47eeb
  PYVISTA_OFF_SCREEN: "true"
  LIBGL_ALWAYS_SOFTWARE: "1"
  MPLCONFIGDIR: /tmp/nacre-matplotlib

jobs:
  foundation:
    name: Foundation (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Restore pinned OpenFOAM image archive
        id: openfoam-cache
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/nacre-openfoam-2606.tar
          key: openfoam-run-linux-amd64-4229997e74defb81548222d511b8e3b95b98305e5df41b8e88b031813fe47eeb

      - name: Prepare pinned OpenFOAM image
        id: openfoam-image
        shell: bash
        run: |
          start=$SECONDS
          if [[ "${{ steps.openfoam-cache.outputs.cache-hit }}" == "true" ]]; then
            docker load --input /tmp/nacre-openfoam-2606.tar
            source=cache
          else
            docker pull "$OPENFOAM_IMAGE_REF"
            docker tag "$OPENFOAM_IMAGE_REF" "$NACRE_CHECKMESH_IMAGE"
            docker save --output /tmp/nacre-openfoam-2606.tar "$NACRE_CHECKMESH_IMAGE"
            source=pull
          fi
          elapsed=$((SECONDS - start))
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "elapsed_s=$elapsed" >> "$GITHUB_OUTPUT"
          echo "OpenFOAM image source: $source; pull/load time: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Start fallback Xvfb display
        uses: pyvista/setup-headless-display-action@v4

      - name: Synchronize workspace
        run: uv sync --all-packages --locked

      - name: Verify lockfile
        run: uv lock --check

      - name: Assert JAX x64 foundation
        run: >-
          uv run python -c "import nacre; import jax; import jax.numpy as jnp;
          assert jax.config.x64_enabled, 'JAX x64 is disabled';
          assert jnp.zeros(1).dtype.name == 'float64', 'JAX default dtype is not float64';
          print('JAX x64 active; default dtype float64')"

      - name: Probe headless renderer fallback chain
        run: uv run python tests/rendering.py

      - name: Run tests
        run: uv run pytest

      - name: Archive visual and metrics artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nacre-test-artifacts
          path: tests/artifacts/
          if-no-files-found: error
          retention-days: 30
