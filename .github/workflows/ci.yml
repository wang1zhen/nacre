name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NACRE_CHECKMESH_IMAGE: nacre-openfoam:2606
  OPENFOAM_IMAGE_REF: docker.io/opencfd/openfoam-run@sha256:4229997e74defb81548222d511b8e3b95b98305e5df41b8e88b031813fe47eeb
  PYVISTA_OFF_SCREEN: "true"
  LIBGL_ALWAYS_SOFTWARE: "1"
  MPLCONFIGDIR: /tmp/nacre-matplotlib

jobs:
  foundation:
    name: Foundation (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Restore pinned OpenFOAM image archive
        id: openfoam-cache
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/nacre-openfoam-2606.tar
          key: openfoam-run-linux-amd64-4229997e74defb81548222d511b8e3b95b98305e5df41b8e88b031813fe47eeb

      - name: Prepare pinned OpenFOAM image
        id: openfoam-image
        shell: bash
        run: |
          start=$SECONDS
          if [[ "${{ steps.openfoam-cache.outputs.cache-hit }}" == "true" ]]; then
            docker load --input /tmp/nacre-openfoam-2606.tar
            source=cache
          else
            docker pull "$OPENFOAM_IMAGE_REF"
            docker tag "$OPENFOAM_IMAGE_REF" "$NACRE_CHECKMESH_IMAGE"
            docker save --output /tmp/nacre-openfoam-2606.tar "$NACRE_CHECKMESH_IMAGE"
            source=pull
          fi
          elapsed=$((SECONDS - start))
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "elapsed_s=$elapsed" >> "$GITHUB_OUTPUT"
          echo "OpenFOAM image source: $source; pull/load time: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Start fallback Xvfb display
        uses: pyvista/setup-headless-display-action@v4

      - name: Install Gmsh runtime libraries
        # The gmsh wheel bundles libgmsh.so but not the system libraries it
        # links against, and the runner image has none of them.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libglu1-mesa libxcursor1 libxinerama1 libxft2 libxrender1

      - name: Synchronize workspace
        run: uv sync --all-packages --locked

      - name: Verify lockfile
        run: uv lock --check

      - name: Assert JAX x64 foundation
        run: >-
          uv run python -c "import nacre; import jax; import jax.numpy as jnp;
          assert jax.config.x64_enabled, 'JAX x64 is disabled';
          assert jnp.zeros(1).dtype.name == 'float64', 'JAX default dtype is not float64';
          print('JAX x64 active; default dtype float64')"

      - name: Probe headless renderer fallback chain
        run: uv run python tests/rendering.py

      - name: Assert the Gmsh frontend is usable
        # tests/test_gmsh_bake.py skips itself when Gmsh will not load, so
        # without this gate a broken runtime would silently drop every bake
        # test, including both sign-convention experiments.
        run: >-
          uv run python -c "import gmsh; import nacre_gmsh;
          gmsh.initialize();
          print('gmsh', gmsh.option.getString('General.Version'), 'usable');
          gmsh.finalize()"

      - name: Run tests
        run: uv run pytest

      - name: Archive visual and metrics artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nacre-test-artifacts
          path: tests/artifacts/
          if-no-files-found: error
          retention-days: 30

  core-license-boundary:
    name: Core alone, Gmsh absent (Python 3.13)
    # The MPL-2.0 core must never acquire a runtime dependency on GPL Gmsh. This
    # job installs only the core distribution, proves Gmsh is unimportable, and
    # runs the whole suite against the committed .npz golden files. If anyone
    # adds a core-module import of gmsh, or lets a core test reach for it, this
    # goes red on that commit instead of the licence boundary quietly eroding.
    needs: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Restore pinned OpenFOAM image archive
        id: openfoam-cache
        uses: actions/cache@v6.1.0
        with:
          path: /tmp/nacre-openfoam-2606.tar
          key: openfoam-run-linux-amd64-4229997e74defb81548222d511b8e3b95b98305e5df41b8e88b031813fe47eeb

      - name: Prepare pinned OpenFOAM image
        shell: bash
        run: |
          if [[ "${{ steps.openfoam-cache.outputs.cache-hit }}" == "true" ]]; then
            docker load --input /tmp/nacre-openfoam-2606.tar
          else
            docker pull "$OPENFOAM_IMAGE_REF"
            docker tag "$OPENFOAM_IMAGE_REF" "$NACRE_CHECKMESH_IMAGE"
          fi

      - name: Start fallback Xvfb display
        uses: pyvista/setup-headless-display-action@v4

      - name: Synchronize the core distribution only
        run: uv sync --package nacre --locked

      - name: Assert Gmsh is unreachable from the core environment
        run: uv run --package nacre python tests/test_license_boundary.py

      - name: Run the core test suite against committed golden files
        run: uv run --package nacre pytest
