[project]
name = "nacre"
version = "0.1.0"
description = "Modular tools for generating hybrid CFD meshes"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.10.2",
    "numpy>=2.4.6",
]
license = "MPL-2.0"
readme = "README.md"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.1",
    "pytest>=9.1.1",
    "pyvista>=0.48.4",
]
